[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operating-health-audit"
version = "0.1.1"
description = "Of the operating units a target operating model declares, which are present and reporting, which are absent, and which appeared undeclared."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The operating-health-audit authors" }]
keywords = ["audit", "operating-model", "organisational-health", "consulting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

# Stage 1 is the shared core and nothing else. The engine is Stage 2 and is an
# extra, because a presence audit answers without it and says so.
dependencies = ["presence-audit>=0.1.9,<0.2"]

[project.optional-dependencies]
# Floor is 0.1.14 and it was MEASURED, not chosen: this package reads
# `partially_checked`, which the engine's NotEvaluatedReason gained at 0.1.14.
# `battery/probe_pin.py` installs each in-range release and runs detect against it.
#
# THE CEILING MOVED TO 0.2 ON A MEASUREMENT, 2026-09-24. `<0.2` had held since
# the engine's 0.1 line and was never re-derived against a 0.2 release, so it
# was a claim about a boundary nobody had crossed. Measured on 0.2.4: 128 passed, the same figure as 0.1.18.
# The floor is raised with it rather than left low: a range is a claim about
# every release inside it, and the releases between the old floor and this one were not
# re-run when the ceiling moved. `partially_checked` is still the reason the
# floor cannot go below 0.1.14.
#
# THE FLOOR IS 0.2.11, AND FORCED BY A FAILING CONTROL. The feeder now sends a
# unit's state through `add_observations`, which 0.2.10 and earlier cast to a
# number -- measured, the first `status` raises ValueError there -- and the model
# declares `axiom_parameters:`, which 0.2.10 and earlier read as nothing. Both
# were FINDINGS F1 and F2, filed upstream as issue #14 and closed by 0.2.11.
detect = ["arbiter-engine>=0.2.11,<0.3"]

[project.urls]
Homepage = "https://github.com/james-sheen/operating-health-audit"
Issues = "https://github.com/james-sheen/operating-health-audit/issues"
Source = "https://github.com/james-sheen/operating-health-audit"

[project.scripts]
operating-health-audit = "operating_health_audit.cli:main"

[project.entry-points."presence_audit.plugins"]
operating-health = "operating_health_audit.vertical:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
