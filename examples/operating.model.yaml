# THE STAGE 2 MODEL. EVERY NUMBER IN IT IS INVENTED except the axiom floors, and
# it says so here rather than in a footnote: there is no client and no operating
# review behind these figures. A real engagement transcribes its own, from its
# own published targets, and `guards/` is what checks the transcription survived.
#
# The subject is an operating model: the divisions, departments, executives,
# projects and processes an organisation says it runs, and the few quantities it
# reports about them. Derived from the `consulting` domain the Core was tested
# with, and it differs from that domain in four places, all measured.
#
# ------------------------------------------------------- what can answer at all
#
# MEASURED against arbiter-engine 0.1.14, by reading `types.AXIOM_MINIMUMS` in the
# installed package rather than the guide:
#
#     CONNECTIVITY  1     CONSISTENCY  1     CONSERVATION  1
#     MONOTONICITY  3     BOUNDEDNESS  5     STABILITY    10
#     RESPONSIVENESS 20   HOMEOSTASIS  30
#
# THOSE FLOORS DO NOT MEAN WHAT READING THEM SUGGESTS, and this comment said the
# wrong thing until the model was run. It read: every one of the source domain's
# thirty declarations would decline `insufficient_samples` from a single
# snapshot. MEASURED on the shipped case study, one capture of fourteen units
# produces ELEVEN findings -- four critical, four high, three warning -- because
# BOUNDEDNESS evaluates a declared `warning:`/`critical:` against the CURRENT
# value, and STABILITY reads the four declared bad `status` states the same way.
# This said SEVEN, four critical and three warning, which stopped being true when
# the states were fed (FINDINGS F17). The sample floor governs the arm that needs
# a history rather than the whole axiom: 103 invariants were checked and 54
# declined `insufficient_samples`, not 103.
#
# The lesson is the one this family keeps relearning: a constant read out of a
# package is not a behaviour, and the run is the only thing that settles which.
#
# What the floors DO mean is that the arms needing history -- HOMEOSTASIS's
# baseline, STABILITY's transitions, MONOTONICITY's direction -- stay silent
# until the captures accumulate. `docs/burn-in.md` carries that arithmetic.
#
# The structural decision stands and is worth more than it looked: this model
# declares CONNECTIVITY over the org structure, which answers from ONE capture.
# THE SOURCE DOMAIN DECLARED FIVE RELATIONSHIP TYPES AND CHECKED NONE OF THEM --
# `REPORTS_TO`, `OWNS`, `LEADS`, `DEPENDS_ON`, `FUNDS` were all declared and no
# indicator referenced any. A relationship type nothing checks is a comment.
#
# THE NUMERIC ARMS ARE A DECLARED BURN-IN, NOT A GAP. At a monthly reporting
# cadence HOMEOSTASIS needs 30 captures -- two and a half years. `docs/burn-in.md`
# carries the arithmetic and the kill criterion. They are declared anyway, because
# a model that omits them would silently stop being an operating review; what is
# NOT done is inventing a cadence that makes the floors look reachable.
#
# THE WINDOW IS A CEILING AND IT DEFAULTS TO ONE HOUR. Undeclared, a series
# captured monthly is ONE observation however long it runs: everything older
# than an hour falls outside. Measured -- 36 monthly captures produced exactly
# the declines of a single snapshot until `window:` was declared.
#
# AND IT MUST SPAN THE SERIES, NOT THE FLOOR. Sized at floor x cadence -- 3
# samples x 30 days for MONOTONICITY -- the arms still declined, because the
# span of a longer series then exceeds the window and the history goes stale.
# So it is declared at ten years on every history arm: a ceiling generous enough
# for any engagement, which is the honest shape for a number whose only job is
# to not exclude what you fed. Measured: at 3650d, 18 findings; sized to the
# floors, 12.

# A ROLE IS DECLARED OR IT IS NOTHING. The engine removed name inference: with no
# `role:` a RESPONSIVENESS or CONSISTENCY indicator declines `missing_role`, and
# the ABSENCE of that decline was never evidence a role was supplied. The four
# the engine accepts are `latency`, `count`, `percentage`, `ratio`.
#
# AND IT IS DECLARED ONLY WHERE SOMETHING READS IT. Those two axioms are a role's
# only readers. This model used to declare one on every numeric indicator, and on
# eighteen of them no declared axiom reads it: the engine reported each as an
# unread field, and a reader of the model took eighteen declarations to be doing
# something. So one role remains, on `cycle_time_days`, where RESPONSIVENESS reads
# it, and a test holds the model's unread fields at none.
#
# AND THE SOURCE DOMAIN PUT RESPONSIVENESS ON THE WRONG INDICATOR. It declared it
# on `throughput`, which is a rate; RESPONSIVENESS is role-gated to `latency`
# alone, so that pair evaluates nothing whatever the sample count. The latency in
# this domain is `cycle_time_days`, and that is where it is declared here.

domain:
  id: operating-health-audit
  name: Operating model health
  description: >-
    The operating units a target operating model declares, the reporting lines
    between them, and the quantities an operating review reports about them.
    Invented in full.

  entity_types: [Division, Department, Executive, Project, Process]
  relationship_types: [reports_to, owns, leads, depends_on, funds]

  # THE BASELINE HOLDS THE SERIES, as the windows below do. HOMEOSTASIS builds
  # its baseline from the last `homeostasis_baseline_days` of history, seven by
  # default -- about one monthly capture -- so until engine 0.2.11 read this
  # block it declined `insufficient_samples` at thirty-six captures exactly as
  # at one (FINDINGS F2). Declared at the windows' ten years for the windows'
  # reason: a ceiling whose only job is to not exclude what was fed. Its own
  # thirty-sample floor still stands, so it answers from the thirtieth capture.
  axiom_parameters:
    homeostasis_baseline_days: 3650

  # WHICH WAY A FAILURE TRAVELS, declared where the structure says so and nowhere
  # else. The engine reads a causal rule as the direction of the edge it names --
  # the edge's source is the cause -- so only a relation whose exported edge
  # already runs from the failing unit to the one it reaches can carry one:
  #
  # - `leads`, executive to department. A department is run by the executive who
  #   leads it; a failure of leadership reaches the department it leads, and the
  #   model already checks that edge with CONNECTIVITY.
  # - `reports_to`, department to division. A division's figures are its
  #   departments' figures, so a department that fails takes its division's with
  #   it.
  #
  # NOT `depends_on`: a process depends on a department, and a failure travels
  # from the department to the process -- against the edge. Declaring it would
  # say the process fails the department. NOT `funds`: nothing here says which
  # way a funding failure runs, and a direction nobody can state is not declared.
  #
  # NO STRENGTHS. Nothing gives one: this model is invented, and a weight is a
  # measured fraction of failures that travel. Without one `hypothesize` answers
  # `cpt_missing`, which is the true answer while nobody has a number to give.
  relationship_rules:
    - type: leads
      source_type: Executive
      target_type: Department
      edge_direction: causal
    - type: reports_to
      source_type: Department
      target_type: Division
      edge_direction: causal
      # HOW MUCH A FIGURE CARRIES along the same edge, which is the other thing
      # the sentence above says: a division's headcount is its departments'
      # headcount, so a department's hire moves its division's total. Declared
      # so the learn stage has one coupling to answer about, and with the
      # number WITHHELD: `gain: estimate` asks the engine to fit it and report a
      # proposal, and nothing writes one back into this file.
      #
      # IT CANNOT BE FITTED FROM A REAL SERIES FOR TEN YEARS. The engine fits a
      # gain from at least 120 paired monthly changes -- 121 captures -- so until
      # then the stage answers `insufficient_samples` by name, which is the true
      # answer. The loop test proves the mechanism on a labelled-synthetic series
      # of 121 captures instead, built so the answer is known. A REAL review need
      # not wait: `docs/burn-in.md` names the two of its own documents that
      # declare this gain and the bound it reaches.
      #
      # A step, with no delay: a hire is in the division's total at the same
      # month-end, so there is no time course to declare beyond that.
      temporal:
        propagation_delay_s: 0
        time_constant_s: 0
        response_model: step
      transition:
        from: headcount
        to: total_headcount
        gain: estimate
        source: >-
          illustrative -- the organisation is invented, and so is the claim that
          its divisions count their departments' people; no count stands behind
          a number, which is why none is written

  # THE ONE LEVER THIS MODEL DECLARES, so an action somebody takes can be filed
  # and graded (`file_action`). Adding people to a department is recorded as
  # executed, and the next monthly capture says whether the headcount moved by
  # what was added. `tolerance` is how close that capture must come: invented,
  # like every number here -- an engagement states its own from how its HR
  # system counts people between a decision and a month-end.
  action_templates:
    - name: add_headcount
      applies_to: Department
      description: Add people to a department's headcount.
      parameters_schema:
        people:
          type: number
          entity_property: headcount
          tolerance: 2
          # The hiring rounds a plan may choose between, invented like every
          # number here. A plan scores each against the objective below.
          candidates: [5, 10, 20]
      effect: add
      source: >-
        a hiring decision recorded as executed; the headcount a department reports
        moves by the people added, give or take the joiners and leavers between the
        decision and the capture
  # WHAT A PLAN PURSUES: the fewest findings the model expects afterwards.
  # Declared so `plan` ranks the hiring rounds above instead of declining
  # `no_objective`. MEASURED before it was written: the rounds do not tie.
  # `headcount` carries HOMEOSTASIS, so a hire is scored by how far it moves a
  # department from its own baseline. Five people leave the two larger
  # departments alone and raise an imagined warning in the two smaller ones;
  # the largest round raises an anomaly there. So the plan ranks doing nothing
  # first, tied with five people into a large department. On invented numbers
  # that is a demonstration of the mechanism, not advice about anybody's hiring.
  planning:
    objective: expected_findings
    # HOW FAR A PLAN LOOKS: each round alone, and two at once -- a hire into one
    # department beside a hire into another. The depth is the model's to
    # choose, and left unsaid the engine searched one deep and stamped
    # `search_depth_not_declared` on every plan. MEASURED at two before it was
    # written: 24 plans rolled out, eleven of them pairs, and none scores below
    # doing nothing, so the ranking's first place is unchanged. The default
    # budget of 200 rollouts covers the search with room to spare.
    max_depth: 2

  # WHEN A CASE CLOSES. A case opens on a finding and resolves after this many
  # checks in a row that looked at its indicator and found nothing at or above
  # this severity.
  cases:
    # `warning` because that is where this model's bounds put what a review asks
    # about: a case that closed while a warning still stood would close on a
    # problem the review still names.
    severity: warning
    # TWO monthly captures: one clean month can be the month a figure happened
    # to dip, and three would carry a unit that recovered into the next quarter's
    # review. Two is the smallest run that is not one reading.
    consecutive_checks: 2

  indicators:

    Division:
      # ANSWERS FROM ONE CAPTURE. A division with no department reporting into it
      # is either dissolved or mis-exported, and either is worth a finding.
      - name: reports_to
        type: RELATIONSHIP
        axioms: [CONNECTIVITY]
        target_type: Department
        relation_type: reports_to
        min_cardinality: 1
        violation_severity: HIGH
      - name: total_revenue_m
        type: NUMERIC
        axioms: [MONOTONICITY, BOUNDEDNESS]
        window: 3650d
      - name: total_headcount
        type: NUMERIC
        axioms: [BOUNDEDNESS]
        window: 3650d
      - name: operating_margin_pct
        type: NUMERIC
        axioms: [HOMEOSTASIS]
        window: 3650d
      # No `timeout:` on any passing state here: how long a restructuring or an
      # at-risk project may last is the review's to declare, and no number in this
      # example says. The engine declines such a state `missing_config` rather
      # than timing it; a real engagement writes its own and names the source.
      - name: status
        type: STATE
        axioms: [STABILITY]
        window: 3650d
        normal: [healthy, growing]
        transient: [restructuring]
        bad: [declining, critical]

    Department:
      - name: reports_to
        type: RELATIONSHIP
        axioms: [CONNECTIVITY]
        target_type: Division
        relation_type: reports_to
        min_cardinality: 1
        violation_severity: HIGH
      - name: headcount
        type: NUMERIC
        axioms: [HOMEOSTASIS]
        window: 3650d
      # The one pair of published bounds this domain actually has. A target
      # operating model that names a turnover ceiling is naming it as an UPPER
      # bound, and the engine fires AT a declared number as well as past it --
      # so 25 is reported, which is what `critical: 25` is supposed to mean.
      - name: turnover_pct
        type: NUMERIC
        axioms: [BOUNDEDNESS, HOMEOSTASIS]
        window: 3650d
        warning: 15
        critical: 25
      - name: revenue_m
        type: NUMERIC
        axioms: [MONOTONICITY, BOUNDEDNESS]
        window: 3650d
      - name: cost_m
        type: NUMERIC
        axioms: [BOUNDEDNESS]
        window: 3650d
      - name: margin_pct
        type: NUMERIC
        axioms: [HOMEOSTASIS]
        window: 3650d
      - name: satisfaction_score
        type: NUMERIC
        axioms: [HOMEOSTASIS, STABILITY]
        window: 3650d
      - name: status
        type: STATE
        axioms: [STABILITY]
        window: 3650d
        normal: [healthy, growing]
        transient: [restructuring]
        bad: [declining, critical]

    Executive:
      # ANSWERS FROM ONE CAPTURE, and it is the finding an operating review is
      # most often actually asked for: a named executive leading nothing.
      #
      # NO `plausible_range:` (FINDINGS F17). Three of these indicators declared
      # one, and nothing on this package's path reads it: the engine exempts the
      # key by name for a document-ingest pipeline this package does not run. So
      # it read as a range check that never ran -- and two shipped ratings, 6.2
      # and 5.1, sit outside the `[0, 5]` it gave `performance_rating`.
      - name: leads
        type: RELATIONSHIP
        axioms: [CONNECTIVITY]
        target_type: Department
        relation_type: leads
        min_cardinality: 1
        violation_severity: HIGH
      - name: tenure_years
        type: NUMERIC
        axioms: [MONOTONICITY]
        window: 3650d
      - name: direct_reports
        type: NUMERIC
        axioms: [BOUNDEDNESS]
        window: 3650d
        warning: 12
        critical: 20
      - name: performance_rating
        type: NUMERIC
        axioms: [HOMEOSTASIS, STABILITY]
        window: 3650d

    Project:
      - name: funds
        type: RELATIONSHIP
        axioms: [CONNECTIVITY]
        target_type: Division
        relation_type: funds
        min_cardinality: 1
        violation_severity: MEDIUM
      - name: budget_m
        type: NUMERIC
        axioms: [BOUNDEDNESS]
        window: 3650d
      - name: spent_m
        type: NUMERIC
        axioms: [BOUNDEDNESS, MONOTONICITY]
        window: 3650d
      - name: completion_pct
        type: NUMERIC
        axioms: [MONOTONICITY]
        window: 3650d
      - name: status
        type: STATE
        axioms: [STABILITY]
        window: 3650d
        normal: [on_track, completed]
        transient: [at_risk]
        bad: [over_budget, delayed, cancelled]

    Process:
      - name: depends_on
        type: RELATIONSHIP
        axioms: [CONNECTIVITY]
        target_type: Department
        relation_type: depends_on
        min_cardinality: 1
        violation_severity: MEDIUM
      # RESPONSIVENESS lives HERE and not on throughput. Role-gated to `latency`,
      # and a cycle time is the only latency this domain reports.
      - name: cycle_time_days
        type: NUMERIC
        axioms: [BOUNDEDNESS, HOMEOSTASIS, RESPONSIVENESS]
        window: 3650d
        role: latency
      - name: error_rate_pct
        type: NUMERIC
        axioms: [BOUNDEDNESS]
        window: 3650d
        warning: 5
        critical: 10
      # NOT IN THE SHIPPED CASE STUDY'S EXPORT. Neither this nor
      # `automation_pct` has a column in it. On one capture `throughput`
      # declines `missing_property`; `automation_pct` declines
      # `insufficient_samples` first, because MONOTONICITY needs three
      # readings before it looks for a value. Declared anyway: they are
      # indicators an operating review asks for, and the declines say
      # truthfully that this export could not answer them. Dropping them
      # would make the model agree with one exporter instead of the domain.
      - name: throughput
        type: NUMERIC
        axioms: [BOUNDEDNESS]
        window: 3650d
      - name: automation_pct
        type: NUMERIC
        axioms: [MONOTONICITY]
        window: 3650d
